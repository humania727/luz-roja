<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Protocolos de la lámpara Aureo M Black, planificación, temporizador e historial.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>
<title>Luz Roja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de salud de una columna; tarjetas blancas sobre fondo cálido, navegación inferior, fichas como hoja deslizable en el teléfono. */
:root {
  --bg: #f5f2f1;          /* fondo cálido, sesgado al rojo */
  --surface: #ffffff;
  --surface-2: #faf7f6;
  --line: #ebe3e1;
  --fg: #1d1819;
  --muted: #655a58;
  --dim: #978b88;
  --accent: #cf3424;      /* rojo terapéutico */
  --accent-strong: #b02818;
  --accent-soft: #fcebe8;
  --on-accent: #ffffff;
  --amber: #a86a12;  --amber-soft: #fbf1df;
  --green: #1d7f5b;  --green-soft: #e4f4ec;
  --violet: #5f46b8; --violet-soft: #eeeafa;
  --blue: #2b65a8;   --blue-soft: #e7eff9;
  --shadow: 0 1px 2px rgba(60, 30, 25, .05), 0 6px 18px rgba(60, 30, 25, .06);
  --shadow-lg: 0 18px 50px rgba(40, 15, 10, .18);
  --scrim: rgba(25, 15, 14, .45);
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121011; --surface: #1b1819; --surface-2: #231f20; --line: #312b2c;
    --fg: #f4efed; --muted: #b3a8a5; --dim: #7f7472;
    --accent: #ff5c49; --accent-strong: #ff7a6a; --accent-soft: rgba(255, 92, 73, .14); --on-accent: #1a0806;
    --amber: #f2b552; --amber-soft: rgba(242, 181, 82, .13);
    --green: #56d3a5; --green-soft: rgba(86, 211, 165, .13);
    --violet: #bba6f2; --violet-soft: rgba(187, 166, 242, .14);
    --blue: #8ab8f0; --blue-soft: rgba(138, 184, 240, .13);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121011; --surface: #1b1819; --surface-2: #231f20; --line: #312b2c;
  --fg: #f4efed; --muted: #b3a8a5; --dim: #7f7472;
  --accent: #ff5c49; --accent-strong: #ff7a6a; --accent-soft: rgba(255, 92, 73, .14); --on-accent: #1a0806;
  --amber: #f2b552; --amber-soft: rgba(242, 181, 82, .13);
  --green: #56d3a5; --green-soft: rgba(86, 211, 165, .13);
  --violet: #bba6f2; --violet-soft: rgba(187, 166, 242, .14);
  --blue: #8ab8f0; --blue-soft: rgba(138, 184, 240, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55); --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body[data-safety="off"] .safety-block { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -0.015em; }
p { margin: 0; }
.wrap { max-width: 960px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.small { font-size: 13.5px; } .xs { font-size: 12.5px; }
.mono { font-variant-numeric: tabular-nums; font-weight: 600; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--dim); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

/* ===== Encabezado ===== */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.top-in { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: inherit; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: radial-gradient(circle at 50% 50%, #fff 0 14%, transparent 15%), radial-gradient(circle at 50% 50%, #ff8a70 0 30%, #d93a2b 31% 100%); box-shadow: 0 4px 12px -4px rgba(207, 52, 36, .6); flex-shrink: 0; }
.brand h1 { font-size: 18px; font-weight: 800; }
.brand .sub { font-size: 12px; color: var(--dim); font-weight: 500; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.person-btn { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; font-weight: 600; font-size: 13.5px; max-width: 160px; min-width: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #1d1819; flex-shrink: 0; }
.person-btn .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--dim); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn[aria-pressed="true"] { color: var(--amber); background: var(--amber-soft); border-color: transparent; }

/* ===== Navegación inferior ===== */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 14px; color: var(--dim); text-decoration: none; font-size: 12px; font-weight: 600; }
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav a[aria-current="page"] svg { background: var(--accent-soft); border-radius: 999px; padding: 3px 14px; width: 52px; height: 28px; }

/* ===== Botones ===== */
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-red { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-red:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-danger { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; min-height: 36px; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.t-red { color: var(--accent); background: var(--accent-soft); }
.t-amber { color: var(--amber); background: var(--amber-soft); }
.t-green { color: var(--green); background: var(--green-soft); }
.t-violet { color: var(--violet); background: var(--violet-soft); }
.src { display: none; }
.ev-mod { color: var(--green); background: var(--green-soft); }
.ev-lim { color: var(--blue); background: var(--blue-soft); }
.ev-pre { color: var(--amber); background: var(--amber-soft); }

/* ===== Sección La lámpara ===== */
.section { display: flex; flex-direction: column; gap: 14px; }
.section > h2 { font-size: 22px; font-weight: 800; }
.lead { font-size: 15.5px; color: var(--muted); max-width: 62ch; }
.hero { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: center; padding-top: 18px; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.05fr 1fr; gap: 32px; } }
.hero h2 { font-size: clamp(28px, 6.5vw, 42px); font-weight: 800; }
.hero h2 em { font-style: normal; color: var(--accent); }
.lamp-wrap { position: relative; max-width: 340px; width: 100%; margin: 0 auto; background: var(--surface); border-radius: 50%; box-shadow: var(--shadow); padding: 14px; }
.lamp-wrap svg { width: 100%; height: auto; display: block; }
.mode-switch { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.mode-switch button { border: 0; background: transparent; border-radius: 10px; padding: 9px 4px; font-weight: 700; font-size: 14px; color: var(--muted); }
.mode-switch button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.mode-card { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 120px; }
.mode-card h3 { font-size: 17px; }

.spectrum { position: relative; height: 52px; border-radius: 12px; overflow: hidden;
  background: linear-gradient(90deg, #ff6a3d 0%, #ff3b2f 13%, #d4102a 33%, #7a0c22 50%, #3a1626 60%, #2a1a24 100%); }
.spectrum::after { content: ""; position: absolute; top: 0; bottom: 0; left: 53%; right: 0; background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.05) 6px 7px); }
.spec-wrap { position: relative; padding-bottom: 62px; }
.spec-mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .9; }
.spec-lbl { position: absolute; top: 60px; transform: translateX(-50%); text-align: center; font-size: 11.5px; line-height: 1.25; white-space: nowrap; color: var(--muted); }
.spec-lbl .nm { font-weight: 700; font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; }
.spec-zone { position: absolute; top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.9); }
.wl-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .wl-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 900px) { .wl-grid { grid-template-columns: repeat(3, 1fr); } }
.wl { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.wl .sw { width: 14px; height: 14px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
.wl .min { min-width: 0; }

.steps { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.step { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.step .n { font-size: 12px; color: var(--accent); font-weight: 700; }
.step h3 { font-size: 16px; }
.curve { width: 100%; height: auto; display: block; margin-top: 4px; }

.ctrl-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .ctrl-grid { grid-template-columns: repeat(3, 1fr); } }
.ctrl { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.ctrl .big { font-family: var(--font-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }

.alert { border-radius: var(--r-sm); padding: 12px 14px; font-size: 13.5px; }
.alert-amber { background: var(--amber-soft); color: var(--fg); }
.alert-amber strong { color: var(--amber); }
.alert-red { background: var(--accent-soft); color: var(--fg); }
.alert-red strong { color: var(--accent); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.list li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.list li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 9px; flex-shrink: 0; }
.list li > span:first-child { flex: 1; min-width: 0; }

details { border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow); }
details > summary { cursor: pointer; padding: 14px 16px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(45deg); margin-right: 4px; transition: transform .2s; }
details[open] > summary::after { transform: rotate(-135deg); }
details > .dbody { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-sm); }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; vertical-align: top; padding: 9px 11px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 700; background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.matrix td { min-width: 120px; } .matrix td:first-child { min-width: 150px; font-weight: 700; }

/* ===== Lista de protocolos ===== */
.search { position: relative; }
.search input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 84px 13px 44px; font-size: 15.5px; color: var(--fg); box-shadow: var(--shadow); }
.search input::placeholder { color: var(--dim); }
.search input:focus { outline: none; border-color: var(--accent); }
.search svg { position: absolute; left: 15px; top: 15px; width: 18px; height: 18px; color: var(--dim); }
.search .clear { position: absolute; right: 8px; top: 8px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.scroller::-webkit-scrollbar { display: none; }
.grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 680px) { .grid { grid-template-columns: repeat(2, 1fr); } }
.pcard { text-align: left; width: 100%; background: var(--surface); border: 0; border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 14px; transition: transform .15s, box-shadow .15s; }
.pcard:hover { box-shadow: 0 1px 2px rgba(60,30,25,.05), 0 10px 26px rgba(60,30,25,.10); }
.pcard:active { transform: scale(.99); }
.pc-head { display: flex; gap: 12px; align-items: center; width: 100%; }
.pc-head .ttl { flex: 1; min-width: 0; }
.pc-head h3 { font-size: 16.5px; font-weight: 700; }
.pc-head .chev { width: 20px; height: 20px; color: var(--dim); flex-shrink: 0; }
.ico { width: 44px; height: 44px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ico svg { width: 23px; height: 23px; }
.ico.lg { width: 52px; height: 52px; border-radius: 15px; } .ico.lg svg { width: 27px; height: 27px; }
.minis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; background: var(--surface-2); border-radius: 12px; padding: 10px 6px; }
.minis.two { grid-template-columns: repeat(2, 1fr); }
.mini { text-align: center; min-width: 0; }
.mini .k { display: block; font-size: 11px; color: var(--dim); font-weight: 600; }
.mini .v { display: block; font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; font-size: 12.5px; color: var(--dim); }

/* ===== Ficha (hoja) ===== */
dialog { border: 0; padding: 0; background: transparent; color: var(--fg); max-width: 100vw; max-height: 100vh; }
dialog::backdrop { background: var(--scrim); }
.dlg { background: var(--bg); border-radius: var(--r-lg); width: min(680px, calc(100vw - 24px)); max-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); }
.dlg-sm { width: min(440px, calc(100vw - 24px)); }
@media (max-width: 640px) {
  #dlgProto { margin: auto 0 0; width: 100vw; }
  #dlgProto .dlg { width: 100vw; border-radius: 22px 22px 0 0; max-height: calc(94dvh - env(safe-area-inset-top, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #dlgProto .dlg::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
}
.dlg-head { padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dlg-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.dlg-foot { padding: 12px 18px; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--muted); flex-shrink: 0; font-size: 14px; }
.sec-t { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 2px 8px; }
.session { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.session > strong { font-family: var(--font-display); font-size: 15.5px; }
.params { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 560px) { .params { grid-template-columns: repeat(4, 1fr); } }
.param { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.param .k { font-size: 12px; color: var(--dim); font-weight: 600; }
.param .v { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin-top: 1px; word-break: break-word; font-variant-numeric: tabular-nums; }
.param .v.long { font-size: 13.5px; line-height: 1.35; font-weight: 700; }
.param .v.ni { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--dim); }
.v-d { color: var(--accent); } .v-h { color: var(--amber); } .v-m { color: var(--green); }
.fund { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.card-block { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 16px; }
.num-in { width: 80px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--fg); font-variant-numeric: tabular-nums; }

/* ===== Historial ===== */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); padding: 14px 8px; text-align: center; }

  // 48 satélites en tres anillos (12 + 16 + 20) alrededor del COB central
  const rings = [[12, 46], [16, 68], [20, 90]];
  let sats = '';
  rings.forEach(([n, r], ri) => {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + ri * 0.17;
      const x = (120 + r * Math.cos(a)).toFixed(1), y = (120 + r * Math.sin(a)).toFixed(1);
      sats += `<circle class="sat" cx="${x}" cy="${y}" r="4.6"/>`;
    }
  });
  return `<svg viewBox="0 0 240 240" role="img" aria-labelledby="lampTitle">
    <title id="lampTitle">Esquema de la lámpara M Black: COB central rodeado de 48 LEDs satélite</title>
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4b3a" stop-opacity=".55"/><stop offset="60%" stop-color="#b3122a" stop-opacity=".18"/><stop offset="100%" stop-color="#b3122a" stop-opacity="0"/></radialGradient>
      <radialGradient id="haloIR" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6e3550" stop-opacity=".45"/><stop offset="100%" stop-color="#6e3550" stop-opacity="0"/></radialGradient>
      <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
    </defs>
    <circle id="lampHalo" class="glow-anim" cx="120" cy="120" r="118" fill="url(#halo)"/>
    <circle cx="120" cy="120" r="104" fill="#120d0e" stroke="#33282a" stroke-width="2"/>
    <circle cx="120" cy="120" r="98" fill="none" stroke="#221a1b" stroke-width="1"/>
    <g id="satGlow" filter="url(#blur)">${sats}</g>
    <g id="satCore">${sats}</g>
    <circle id="cobGlow" cx="120" cy="120" r="22" filter="url(#blur)" fill="#ff4b3a"/>
    <circle id="cob" cx="120" cy="120" r="15" fill="#ff6a50" stroke="#ffd2c8" stroke-width="1"/>
    <text id="lampQ" x="120" y="128" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="26" font-weight="800" fill="#f2b552" opacity="0">?</text>
  </svg>`;
}
function paintLamp() {
  const m = lampMode;
  const glow = $('satGlow'), core = $('satCore'), cob = $('cob'), cobG = $('cobGlow'), halo = $('lampHalo'), q = $('lampQ');
  if (!glow) return;
  const set = (g, fill, op) => g.querySelectorAll('.sat').forEach(c => { c.setAttribute('fill', fill); c.setAttribute('opacity', op); });
  if (m === 3) { set(glow, '#ff4b3a', 1); set(core, '#ff8a70', 1); cob.setAttribute('fill', '#ff6a50'); cob.setAttribute('opacity', 1); cobG.setAttribute('opacity', 1); halo.setAttribute('fill', 'url(#halo)'); halo.setAttribute('opacity', 1); q.setAttribute('opacity', 0); }
  if (m === 2) { set(glow, '#6e3550', .9); set(core, '#4a2133', 1); cob.setAttribute('fill', '#1f1819'); cob.setAttribute('opacity', 1); cobG.setAttribute('opacity', 0); halo.setAttribute('fill', 'url(#haloIR)'); halo.setAttribute('opacity', 1); q.setAttribute('opacity', 0); }
  if (m === 1) { set(glow, '#33282a', 0); set(core, '#3a3031', 1); cob.setAttribute('fill', '#2a2122'); cobG.setAttribute('opacity', 0); halo.setAttribute('opacity', 0); q.setAttribute('opacity', 1); }
  const M = MODES[m];
  $('modeCard').innerHTML = `<h3>${M.name} · ${M.sub}</h3><p class="small muted">${esc(M.text)}</p>`;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.mode === m));
}

}

   ===================================================================== */
function myPlan() {
  if (!S.plan[S.current]) S.plan[S.current] = { active: [], days: {} };

  return pl;
}
function savePlan() { save('plan', S.plan); }

function sessionDays(p, s) {
  if (s.plan === 'fixed') return s.days;
  if (s.plan === 'flex') return myPlan().days[p.id + '|' + s.id] || [];

}
function sessionsForDay(p, d) {

  const rep = new Set(list.filter(s => s.replaces).map(s => s.replaces));

}

}
function todayItems() {
  const d = new Date().getDay(), out = [];
  myPlan().active.forEach(pid => { const p = proto(pid); sessionsForDay(p, d).forEach(s => out.push({ p, s, done: doneToday(p.id, s.id) })); });
  return out;
}

  savePlan();

}
function renderPlan() {

    <p class="lead">Agregue los protocolos que usa y elija los días en los que la guía deja libre la elección.</p></div>`;
  const items = todayItems();
  h += `<div class="stack" style="gap:10px"><div class="spread"><span class="sec-t" style="margin:0">Hoy · ${DAYS[d]}</span>${items.length ? `<span class="tag ${items.every(i => i.done) ? 't-green' : ''}">${items.filter(i => i.done).length} de ${items.length} hechas</span>` : ''}</div>`;
  if (!act.length) h += `<div class="empty">Todavía no hay protocolos en su planificación.<br>Agréguelos aquí abajo o desde la ficha de cada protocolo.</div>`;
  else if (!items.length) h += `<div class="empty">No hay sesiones planificadas para hoy.</div>`;
  items.forEach(({ p, s, done }) => {
    h += `<div class="today-row ${done ? 'done' : ''}">${icon(p)}<div class="info"><strong>${esc(p.title)}</strong>
      <div class="xs muted">${esc(s.label)} · ${esc(s.dist)} · ${esc(timeText(s))}${hzShort(s.hz) ? ' · ' + esc(hzShort(s.hz)) : ''}</div></div>
      ${done ? '<span class="tag t-green">Hecha</span>' : `<div class="row"><button class="btn btn-sm" type="button" data-done="${p.id}|${s.id}">Marcar hecha</button><button class="btn btn-sm btn-red" type="button" data-load="${p.id}|${s.id}">Iniciar</button></div>`}</div>`;
  });
  h += `</div>`;
  if (act.length) {
    h += `<div class="stack" style="gap:10px"><span class="sec-t" style="margin:0">Esta semana</span><div class="week">${WEEK_ORDER.map(wd => {
      const n = act.reduce((a, p) => a + sessionsForDay(p, wd).length, 0);
      return `<div class="wday ${wd === d ? 'now' : ''}">${DS[wd]}<div class="n">${n}</div></div>`;
    }).join('')}</div></div>`;
  }
  h += `<div class="stack" style="gap:10px"><span class="sec-t" style="margin:0">Mis protocolos</span>`;
  act.forEach(p => {
    h += `<div class="planp"><div class="spread" style="flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap;gap:10px;min-width:0">${icon(p)}<div style="min-width:0"><strong>${esc(p.title)}</strong><div class="xs muted">${esc(p.freq)}</div></div></div>
      <button class="btn btn-sm" type="button" data-planremove="${p.id}" aria-label="Quitar ${esc(p.title)} de la planificación">Quitar</button></div>`;
    p.sessions.filter(s => s.plan !== 'free').forEach(s => {
      h += `<div class="ps"><div class="small"><strong>${esc(s.label)}</strong> <span class="muted">· ${esc(s.dist)} · ${esc(timeText(s))}</span></div>`;
      if (s.plan === 'fixed') h += `<div class="xs muted">Días fijos según la guía.</div>`;
      else {
        const days = sessionDays(p, s), n = days.length;
        const msg = s.perWeek == null ? `${n} día(s) elegidos · la guía no fija cantidad` : `${n} de ${s.perWeek} día(s) elegidos`;
        h += `<div class="days" role="group" aria-label="Días para ${esc(s.label)}">${WEEK_ORDER.map(wd => `<button type="button" class="dayb" data-pday="${p.id}|${s.id}|${wd}" aria-pressed="${days.includes(wd)}" aria-label="${DAYS[wd]}">${DS[wd]}</button>`).join('')}</div>
          <div class="xs" style="color:${s.perWeek != null && n !== s.perWeek ? 'var(--amber)' : 'var(--dim)'}">${msg}</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
  });
  const avail = PROTOCOLS.filter(p => !pl.active.includes(p.id) && p.sessions.some(s => s.plan !== 'free'));
  h += `<div class="row" style="flex-wrap:nowrap"><label class="sr-only" for="planAdd">Protocolo para agregar</label>
    <select class="sel" id="planAdd"><option value="">Agregar un protocolo…</option>${avail.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select>
    <button class="btn btn-red" type="button" id="planAddBtn">Agregar</button></div></div>`;
  $('v-planificacion').innerHTML = h;
}

/* =====================================================================
   INICIO (dashboard)
   ===================================================================== */
const MOD_ICONS = {
  protocolos: '<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  planificacion: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',
  temporizador: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/>',
  historial: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5M12 8v4l3 2"/>',
  lampara: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 5.5v.01M12 18.5v.01M5.5 12h.01M18.5 12h.01M7.4 7.4h.01M16.6 16.6h.01M7.4 16.6h.01M16.6 7.4h.01"/>',
  seguridad: '<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m9 12 2 2 4-4"/>'
};
function modIcon(k) { return `<span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${MOD_ICONS[k]}</svg></span>`; }
function renderDashboard() {
  const hr = new Date().getHours();
  const hi = hr < 12 ? 'Buenos días' : hr < 19 ? 'Buenas tardes' : 'Buenas noches';
  const items = todayItems();
  const ws = weekStart();
  const week = S.log.filter(e => e.person === S.current && new Date(e.start) >= ws && e.status !== 'interrumpida').length;
  const planSt = !myPlan().active.length ? ['Organice su semana', true] : items.length ? [`${items.filter(i => i.done).length} de ${items.length} sesiones hoy`, false] : ['Sin sesiones hoy', true];
  const mods = [
    ['protocolos', 'Protocolos', 'Los protocolos de la guía y cómo configurar la lámpara.', [`${PROTOCOLS.length - 1} protocolos + iluminación`, false]],
    ['planificacion', 'Mi planificación', 'Sus protocolos y días de la semana.', planSt],
    ['temporizador', 'Temporizador', 'Sesión activa con alarma al terminar.', [timerSummary(), !(T && T.running)]],
    ['historial', 'Mi historial', 'Sesiones realizadas por persona.', [`${week} esta semana`, week === 0]],
    ['lampara', 'La lámpara', 'Modos, longitudes de onda y controles.', ['Modo 3 · Modo 2', true]],
    ['seguridad', 'Seguridad', 'Precauciones antes de usarla.', ['Leer antes de usar', true]]
  ];
  $('v-inicio').innerHTML = `<div class="hello"><span class="muted small">${esc(fmtDate(new Date()))}</span><h2>${hi}, ${esc(me().name)}</h2></div>
    <div class="mods">${mods.map(([k, t, d, [st, idle]]) => `<a class="mod" href="#${k}">${modIcon(k)}
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      <h3>${t}</h3><span class="d">${d}</span><span class="st ${idle ? 'idle' : ''}" ${k === 'temporizador' ? 'id="dashTimer"' : ''}>${esc(st)}</span></a>`).join('')}</div>`;
}
function backBtn() { return `<button class="back" type="button" data-home><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Inicio</button>`; }

/* =====================================================================
   TEMPORIZADOR A PANTALLA COMPLETA
   ===================================================================== */
function renderTimerView() {
  let h = `${backBtn()}<div class="view-head"><h2>Temporizador</h2></div>`;
  if (!T) {
    const items = todayItems().filter(i => !i.done);
    h += `<div class="empty">No hay una sesión cargada.<br>Elija un protocolo y pulse <strong>Iniciar temporizador</strong>.<div style="margin-top:12px"><a class="btn btn-red" href="#protocolos">Ver protocolos</a></div></div>`;
    if (items.length) h += `<span class="sec-t" style="margin:0">Pendientes de hoy</span>` + items.map(({ p, s }) => `<div class="today-row">${icon(p)}<div class="info"><strong>${esc(p.title)}</strong><div class="xs muted">${esc(s.label)} · ${esc(s.dist)} · ${esc(timeText(s))}</div></div><button class="btn btn-sm btn-red" type="button" data-load="${p.id}|${s.id}">Iniciar</button></div>`).join('');
    $('v-temporizador').innerHTML = h;
    return;
  }
  const pp = person(T.person) || me();
  h += `<div class="bigtimer">
    <div class="bigring" id="bRing"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="42" stroke-width="6" fill="none"/><circle class="prog" id="bProg" cx="50" cy="50" r="42" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg>
      <div class="tt"><span class="eyebrow" id="bStatus">Lista</span><b id="bTime" role="timer">00:00</b><span class="xs muted">${esc(pp.name)}</span></div></div>
    <div><h3 style="font-size:19px">${esc(proto(T.pid).title)}</h3><div class="small muted">${esc(T.label)}</div></div>
    <div class="minis" style="max-width:420px"><div class="mini"><span class="k">Modo</span><span class="v">${esc(String(T.mode).replace('Modo ', ''))}</span></div><div class="mini"><span class="k">Distancia</span><span class="v" style="color:var(--accent)">${esc(T.dist)}</span></div><div class="mini"><span class="k">Tiempo</span><span class="v">${T.min} min</span></div><div class="mini"><span class="k">Pulsación</span><span class="v" style="color:var(--amber)">${esc(hzShort(T.hz) || '—')}</span></div></div>
    <div class="bigctl"><button class="btn btn-red" type="button" id="bMain" data-tact="main">Iniciar</button><button class="btn" type="button" id="bFinish" data-tact="finish" hidden>Finalizar</button></div>
    <div class="bigctl"><button class="btn btn-sm" type="button" id="bMinus" data-tact="minus">−1 min</button><button class="btn btn-sm" type="button" id="bPlus" data-tact="plus">+1 min</button><button class="btn btn-sm" type="button" id="bSound" data-tact="sound">Sonido</button><button class="btn btn-sm" type="button" data-tact="close">Quitar</button></div>
  </div>`;
  $('v-temporizador').innerHTML = h;
  updateTimerUI();
}

/* =====================================================================
   SEGURIDAD
   ===================================================================== */
function renderSafety() {
  let h = `${backBtn()}<div class="view-head"><span class="eyebrow">Antes de usarla</span><h2>Seguridad</h2></div>`;
  h += `<div class="alert alert-amber">La M Black <strong>no es un dispositivo médico</strong> y no está destinada a diagnosticar, tratar, curar ni prevenir enfermedades. En caso de embarazo, condición médica, uso en menores, tratamientos activos o medicamentos fotosensibilizantes, consulte a su profesional de salud.</div>`;
  h += `<div class="card-block"><ul class="list">
      <li><span>No mirar directamente la luz durante periodos prolongados. Cerca de los ojos, use gafas o mantenga los ojos cerrados.</span></li>
      <li><span>La luz pulsada entre ~3 y 30 Hz puede desencadenar crisis en personas con epilepsia fotosensible.</span></li>
      <li><span>Respetar tiempo, distancia y frecuencia; suspender si hay incomodidad o irritación.</span></li>
      <li><span>Usar la lámpara de forma localizada y evitar exposiciones prolongadas fuera de protocolo.</span></li>
      <li><span>No usar sobre heridas graves sin supervisión médica. Mantener fuera del alcance de niños.</span></li>
      <li><span>Limpiar con paño seco o apenas húmedo, no cubrir durante el uso y revisar cables periódicamente.</span></li>
    </ul></div>`;
  h += `<span class="sec-t" style="margin:0">Alertas que aparecen en las fichas</span>` + Object.values(SAFETY).map(s => `<div class="alert alert-red"><strong>${esc(s.t)}.</strong> ${esc(s.d)}</div>`).join('');
  h += `<p class="xs dim">El botón del escudo, arriba, oculta o muestra las precauciones dentro de las fichas. Esta sección siempre está disponible.</p>`;
  $('v-seguridad').innerHTML = h;
}
/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
const VIEWS = ['inicio', 'protocolos', 'planificacion', 'temporizador', 'historial', 'lampara', 'seguridad'];
let view = 'inicio';
function route() {
  const v = (location.hash || '').slice(1);
  view = VIEWS.includes(v) ? v : 'inicio';
  VIEWS.forEach(x => { $('v-' + x).hidden = x !== view; });
  document.querySelectorAll('.nav a').forEach(a => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.body.classList.toggle('on-timer-view', view === 'temporizador');
  refreshView();
  fitSpace();
  window.scrollTo(0, 0);
}
function refreshView() {
  if (view === 'inicio') renderDashboard();
  else if (view === 'planificacion') renderPlan();
  else if (view === 'temporizador') renderTimerView();
  else if (view === 'historial') renderHistory();
  else if (view === 'seguridad') renderSafety();
}
// Vuelve a la pantalla principal: cierra fichas, limpia la búsqueda y sube al inicio
function goHome() {
  if ($('dlgConfirm').open) closeConfirm(false);
  ['dlgProto', 'dlgPeople'].forEach(id => { if ($(id).open) $(id).close(); });
  query = ''; if ($('q')) { $('q').value = ''; $('qClear').hidden = true; }
  renderGrid();
  if (location.hash !== '#inicio') location.hash = 'inicio'; else route();
  window.scrollTo(0, 0);
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.close !== undefined) { closeDialog(t.closest('dialog')); return; }
  if (d.mode) { lampMode = +d.mode; paintLamp(); return; }
  if (d.open) { openProto(d.open); return; }
  if (d.load) { const [pid, sid] = d.load.split('|'); requestLoad(pid, sid); return; }
  if (d.loadcustom) {
    const [pid, sid] = d.loadcustom.split('|'); const inp = $('cm-' + pid + '-' + sid); const v = parseInt(inp && inp.value, 10);
    if (!v || v < 1 || v > 480) { toast('Indique los minutos (1 a 480). Esta sesión no tiene una duración indicada.', 'warn'); inp && inp.focus(); return; }
    requestLoad(pid, sid, v); return;
  }
  if (d.done) { const [pid, sid] = d.done.split('|'); markDone(pid, sid); return; }
  if (d.home !== undefined) { goHome(); return; }
  if (d.tact) { timerAction(d.tact); return; }
  if (d.plantoggle) {
    const on = togglePlan(d.plantoggle);
    toast(on ? 'Agregado a la planificación de ' + me().name + '.' : 'Quitado de la planificación.', 'ok');
    closeDialog($('dlgProto'));
    if (on && proto(d.plantoggle).sessions.some(s => s.plan === 'flex' && s.perWeek)) location.hash = 'planificacion';
    else refreshView();
    return;
  }
  if (d.planremove) { togglePlan(d.planremove); renderPlan(); return; }
  if (d.pday) {
    const [pid, sid, wd] = d.pday.split('|'); const k = pid + '|' + sid, pl = myPlan(), cur = pl.days[k] || [], n = +wd;
    pl.days[k] = cur.includes(n) ? cur.filter(x => x !== n) : cur.concat(n);
    savePlan(); renderPlan();
    const again = document.querySelector(`[data-pday="${d.pday}"]`); if (again) again.focus();
    return;
  }
  if (d.hf) { histFilter = d.hf; renderHistory(); return; }
  if (d.del) { if (await askConfirm('Eliminar registro', 'Este registro se borrará del historial.', 'Eliminar')) { S.log = S.log.filter(e => e.id !== d.del); save('log', S.log); renderHistory(); } return; }
  if (d.pick) { S.current = d.pick; save('current', S.current); histFilter = 'me'; renderPeople(); renderPersonBtn(); refreshView(); if (T && !T.running && !T.startedAt) { T.person = S.current; persistTimer(); updateTimerUI(); } return; }
  if (d.pedit) { editingPerson = d.pedit; renderPeople(); const i = $('pe-name'); i.focus(); i.select(); return; }
  if (d.psave) { const n = $('pe-name').value.trim(); if (n) { person(d.psave).name = n; save('people', S.people); } editingPerson = null; renderPeople(); renderPersonBtn(); refreshView(); return; }
  if (d.pdel) {
    const p = person(d.pdel), n = S.log.filter(e => e.person === p.id).length;
    if (await askConfirm('Eliminar a ' + p.name, n ? `También se borrarán sus ${n} registro(s) del historial.` : 'No tiene registros en el historial.', 'Eliminar')) {
      S.people = S.people.filter(x => x.id !== p.id); S.log = S.log.filter(e => e.person !== p.id);
      if (S.current === p.id) S.current = S.people[0].id;
      save('people', S.people); save('log', S.log); save('current', S.current);
      renderPeople(); renderPersonBtn(); refreshView();
    }
    return;
  }
  switch (t.id) {
    case 'safetyBtn': S.safety = !S.safety; save('safety', S.safety); applySafety(); toast(S.safety ? 'Precauciones visibles.' : 'Precauciones ocultas. Puede mostrarlas de nuevo con el mismo botón.'); break;
    case 'homeBtn': case 'homeBrand': goHome(); break;
    case 'personBtn': editingPerson = null; renderPeople(); openDialog($('dlgPeople')); break;
    case 'qClear': query = ''; $('q').value = ''; t.hidden = true; renderGrid(); $('q').focus(); break;
    case 'tMain': timerAction('main'); break;
    case 'tFinish': timerAction('finish'); break;
    case 'tMinus': timerAction('minus'); break;
    case 'tPlus': timerAction('plus'); break;
    case 'tSound': timerAction('sound'); break;
    case 'tClose': timerAction('close'); break;
    case 'tOpen': location.hash = 'temporizador'; break;
    case 'themeLight': setTheme('light'); break;
    case 'themeDark': setTheme('dark'); break;
    case 'planAddBtn': { const v = $('planAdd').value; if (!v) { $('planAdd').focus(); break; } togglePlan(v); renderPlan(); break; }
    case 'dcOk': closeConfirm(true); break;
    case 'dcCancel': closeConfirm(false); break;
  }
});
function timerAction(a) {
  if (a === 'main') { if (T) T.running ? pauseTimer() : startTimer(); }
  else if (a === 'finish') finalize('finalizada antes');
  else if (a === 'minus') adjust(-1);
  else if (a === 'plus') adjust(1);
  else if (a === 'sound') { S.sound = !S.sound; save('sound', S.sound); updateTimerUI(); }
  else if (a === 'close') closeTimer();
}
document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.id === 'pe-name') { ev.preventDefault(); const b = document.querySelector('[data-psave]'); b && b.click(); }
});
['dlgProto', 'dlgPeople', 'dlgConfirm'].forEach(id => {
  const dlg = $(id);
  dlg.addEventListener('cancel', ev => { ev.preventDefault(); id === 'dlgConfirm' ? closeConfirm(false) : closeDialog(dlg); });
  dlg.addEventListener('click', ev => { if (ev.target === dlg) id === 'dlgConfirm' ? closeConfirm(false) : closeDialog(dlg); });
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T && T.running) { onTick(); if (T.running) requestWakeLock(); } });
window.addEventListener('hashchange', route);
if ('ResizeObserver' in window) new ResizeObserver(fitSpace).observe($('timer'));

/* =====================================================================
   INICIO
   ===================================================================== */
function applySafety() {
  document.body.dataset.safety = S.safety ? 'on' : 'off';
  $('safetyBtn').setAttribute('aria-pressed', S.safety);
  $('safetyBtn').setAttribute('aria-label', S.safety ? 'Ocultar precauciones' : 'Mostrar precauciones');
}
ensurePeople();
applyTheme();
applySafety();
renderPersonBtn();
renderLamp();
renderProtocolsShell();
route();
restoreTimer();
</script>

<script>
/* Registro del service worker (instalación y uso sin conexión) */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
